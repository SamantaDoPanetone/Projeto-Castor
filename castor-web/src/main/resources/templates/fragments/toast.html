<th:block th:fragment="toast">

    <div th:if="${successMessage}"
         class="toast align-items-center text-bg-success text-opacity-25 border-0"
         role="alert"
         data-bs-autohide="true">
        <div class="d-flex">
            <div class="toast-body"
                 th:text="${successMessage}">
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>
    </div>

    <div th:if="${errorMessage}"
         class="toast align-items-center text-bg-danger text-opacity-25 border-0"
         role="alert"
         data-bs-autohide="true">
        <div class="d-flex">
            <div class="toast-body"
                 th:text="${errorMessage}">
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>
    </div>

</th:block>
