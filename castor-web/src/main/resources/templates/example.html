<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap/bootstrap.css}" rel="stylesheet">
    <title>Página Home</title>
    <script th:src="@{/js/alpine/alpine-3.15.8.min.js}" defer></script>
</head>
<body>

<div class="container" x-data="pessoaModal">

    <h3>Lista de pessoas</h3>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row mt-5 mb-5">
        <div class="col-8">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#pessoaModal" @click="openCreate">Adicionar</button>
        </div>
        <div class="col-4"></div>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Id</th>
            <th scope="col">Nome</th>
            <th scope="col">Criado em</th>
            <th scope="col">Atualizado em</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>
        <tbody>
            <tr th:if="${not #lists.isEmpty(pessoas)}" th:each="p, stat : ${pessoas}">
                <th th:text="${stat.count}" scope="row"></th>
                <th th:text="${p.id}" scope="row"></th>
                <td th:text="${p.name}"></td>
                <td th:text="${#temporals.format(p.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(p.updatedAt,'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <button type="button" class="btn btn-sm btn-light" data-bs-toggle="modal" data-bs-target="#pessoaModal" alt="Editar"
                            th:data-id="${p.id}" th:data-name="${p.name}" x-on:click="openEdit($event.currentTarget.dataset)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                            <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
                        </svg>
                    </button>

                    <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deletePessoaModal"
                            th:data-id="${p.id}" th:data-name="${p.name}" x-on:click="openDelete($event.currentTarget.dataset)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                            <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                        </svg>
                    </button>

                </td>
            </tr>

        </tbody>
        <tfoot th:if="${#lists.isEmpty(pessoas)}">
            <tr>
                <td colspan="2" class="text-center">Não foram encontrados resultados.</td>
            </tr>
        </tfoot>
    </table>

    <!-- MODAL para adicionar e editar pessoa -->
    <div
            class="modal fade"
            id="pessoaModal"
            tabindex="-1"
            aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header">
                    <h5 class="modal-title" x-text="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <form method="post" action="/save">
                    <div class="modal-body">

                        <!-- ID oculto (edit) -->
                        <input type="hidden" name="id" x-model="pessoaId">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    name="name"
                                    x-model="pessoaName"
                                    required>
                        </div>

                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- MODAL para remover pessoa -->
    <div
            class="modal fade"
            id="deletePessoaModal"
            tabindex="-1"
            aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar exclusão</h5>
                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <p>
                        Tem certeza que deseja excluir a pessoa
                        <strong x-text="pessoaName"></strong>?
                    </p>
                    <p class="text-danger mb-0">
                        Esta ação não poderá ser desfeita.
                    </p>
                </div>

                <!-- Footer -->
                <form method="post" action="/delete">
                    <input type="hidden" name="id" x-model="pessoaId">

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-danger">
                            Excluir
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>


</div>


<script th:src="@{/js/bootstrap/bootstrap.bundle.js}"></script>
<script th:src="@{/js/custom/example.js}"></script>

</body>
</html>
