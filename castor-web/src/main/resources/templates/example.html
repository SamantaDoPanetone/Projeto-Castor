<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Página Home</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap/bootstrap.css}" rel="stylesheet">
    <script th:src="@{/js/htmx/htmx-2.0.8.min.js}" defer></script>
    <script th:src="@{/js/alpine/alpine-3.15.8.min.js}" defer></script>
</head>
<body>

<!-- Toast Container GLOBAL -->
<div id="toast-container"
     class="position-fixed top-0 end-0 p-3"
     style="z-index: 2000;">
</div>

<div class="container" x-data="pessoaModal">

    <h3>Lista de pessoas</h3>

    <div class="row mt-5 mb-5">
        <div class="col-8">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#pessoaModal" x-on:click="openCreate">Adicionar</button>
        </div>
        <div class="col-4"></div>
    </div>

    <div id="pessoas-content">
        <div th:replace="fragments/pessoas-content :: content"></div>
    </div>


    <!-- MODAL para adicionar e editar pessoa -->
    <div
            class="modal fade"
            id="pessoaModal"
            tabindex="-1"
            aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header">
                    <h5 class="modal-title" x-text="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <form hx-post="/save"
                      hx-target="#pessoas-content"
                      hx-swap="outerHTML"
                      hx-on="htmx:afterOnLoad: showToast()">
                    <div class="modal-body">

                        <!-- ID oculto (edit) -->
                        <input type="hidden" name="id" x-model="pessoaId">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    name="name"
                                    x-model="pessoaName"
                                    required>
                        </div>

                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- MODAL para remover pessoa -->
    <div
            class="modal fade"
            id="deletePessoaModal"
            tabindex="-1"
            aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar exclusão</h5>
                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <p>
                        Tem certeza que deseja excluir a pessoa
                        <strong x-text="pessoaName"></strong>?
                    </p>
                    <p class="text-danger mb-0">
                        Esta ação não poderá ser desfeita.
                    </p>
                </div>

                <!-- Footer -->
                <form hx-post="/delete"
                      hx-target="#pessoas-content"
                      hx-swap="outerHTML"
                      hx-on="htmx:afterOnLoad: showToast()">
                    <input type="hidden" name="id" x-model="pessoaId">

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-danger">
                            Excluir
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.js}"></script>
<script th:src="@{/js/custom/example.js}"></script>

</body>
</html>
